name: Run Rfam SQL Query

on:
  push:
    paths:
      - 'query.sql'   # запускается ТОЛЬКО при изменении этого файла

jobs:
  run-query:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install MySQL client
        run: sudo apt-get install -y mysql-client

      - name: Run SQL query
        run: |
          mysql \
            --user=rfamro \
            --host=mysql-rfam-public.ebi.ac.uk \
            --port=4497 \
            --database=Rfam \
            < query.sql